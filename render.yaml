services:
  - type: web
    name: askdetectives-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
        # IMPORTANT: Set this in Render dashboard (do NOT commit credentials)
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: FRONTEND_URL
        value: https://www.askdetectives.com
      - key: CSRF_ALLOWED_ORIGINS
        value: https://www.askdetectives.com,https://www.askdetectives.com,https://askdetectives1.vercel.app,https://api.askdetectives.com,https://askdetectives.vercel.app
      - key: SESSION_SECRET
        sync: false
        # IMPORTANT: Set this in Render dashboard with a strong random value
        # Generate one with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: BASE_URL
        value: https://askdetectives-backend.onrender.com
