<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO_TITLE_INJECTION_POINT -->
    <title>Ask Detectives | Find Professional Private Investigators</title>
    <!-- SEO_META_INJECTION_POINT -->
    <meta name="description" content="Find vetted private investigators and detective services. Compare ratings, services, and contact trusted professionals." />
    <meta name="keywords" content="private investigator, detective agency, background checks, surveillance, find a detective, investigator directory, professional investigations, ask detectives">

    <meta property="og:title" content="Ask Detectives | Find Professional Private Investigators" />
    <meta property="og:description" content="The marketplace for professional private investigation services. Find verified detectives for your needs." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ask Detectives" />
    <meta property="og:image" content="/social-preview.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FindDetectives" />
    <meta name="twitter:title" content="Ask Detectives | Find Professional Private Investigators" />
    <meta name="twitter:description" content="The marketplace for professional private investigation services. Find verified detectives for your needs." />
    <meta name="twitter:image" content="/social-preview.jpg" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="alternate" type="application/rss+xml" title="Ask Detectives RSS Feed" href="/rss.xml" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- SEO_JSON_LD_INJECTION_POINT -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ask Detectives",
        "url": "https://www.askdetectives.com",
        "logo": "https://www.askdetectives.com/favicon.png",
        "sameAs": ["https://twitter.com/FindDetectives"],
        "areaServed": "Worldwide",
        "description": "Find vetted private investigators and detective services."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://www.askdetectives.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.askdetectives.com/search?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="ssr-location-section">
      <!-- HOMEPAGE_AUTHORITY_INJECTION_POINT -->
    </div>
    <script>
      // Move SSR location section above Footer after React renders
      (function() {
        function moveLocationSection() {
          const ssrSection = document.getElementById('ssr-location-section');
          const footer = document.querySelector('footer');
          const hasContent = ssrSection && ssrSection.querySelector('.homepage-authority');
          
          if (hasContent && footer && footer.parentNode) {
            // Only move if not already positioned
            if (ssrSection.nextSibling !== footer) {
              footer.parentNode.insertBefore(ssrSection, footer);
            }
          }
        }
        // Wait for React to render before moving
        setTimeout(moveLocationSection, 200);
        setTimeout(moveLocationSection, 500);
        setTimeout(moveLocationSection, 1000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
