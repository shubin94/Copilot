<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO_TITLE_INJECTION_POINT -->
    <!-- Title is now fully controlled by React SEO component -->
    <!-- SEO_META_INJECTION_POINT -->
    <!-- Meta description and keywords controlled by React SEO component -->
    <link rel="canonical" href="https://www.askdetectives.com/" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="alternate" type="application/rss+xml" title="Ask Detectives RSS Feed" href="/rss.xml" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- SEO_JSON_LD_INJECTION_POINT -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Ask Detectives",
        "url": "https://www.askdetectives.com",
        "logo": "https://www.askdetectives.com/favicon.png",
        "sameAs": ["https://twitter.com/FindDetectives"],
        "areaServed": "Worldwide",
        "description": "Find vetted private investigators and detective services."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://www.askdetectives.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.askdetectives.com/search?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
