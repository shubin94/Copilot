name: Migrate Assets to Supabase

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Debug npm config before install
        shell: bash
        run: |
          set -euo pipefail
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "NODE_ENV: ${NODE_ENV:-<unset>}"
          echo "npm_config_production: ${npm_config_production:-<unset>}"
          echo "npm_config_ignore_scripts: ${npm_config_ignore_scripts:-<unset>}"
          npm config get production || true
          npm config get ignore-scripts || true

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_production: "false"
          npm_config_ignore_scripts: "false"

      - name: Run asset migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/migrate-assets-to-supabase.ts

